<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YA EVENTS | London Event Planning</title>
<meta name="description" content="YA EVENTS offers elegant event planning and coordination across London. Weddings, Nikkahs and private celebrations.">
<style>
:root {
  --ivory:#faf8f3;
  --cream:#f1ece3;
  --sand:#ded2c1;
  --taupe:#887966;
  --champagne:#b69b73;
  --ink:#39342e;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--ivory);
  color:var(--ink);
  font-family:Arial,sans-serif;
  line-height:1.7;
}
h1,h2,h3,.brand{
  font-family:Georgia,serif;
  font-weight:400;
}
h1{font-size:clamp(3rem,8vw,5.8rem);line-height:1.08}
h2{font-size:clamp(2rem,5vw,3rem)}
a{color:inherit;text-decoration:none}
header{
  padding:22px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #e9e1d5;
  background:var(--ivory);
  position:sticky;top:0;z-index:10;
}
.brand{font-size:1.65rem;letter-spacing:5px}
